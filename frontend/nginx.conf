server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cho phép upload ảnh sự cố (giới hạn của API là 5 MB)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Header bảo mật (các location bên dưới không dùng add_header nên đều thừa hưởng)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API: chuyển tiếp sang container "api"
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # API đã tự gắn các header này; ẩn bản của API để tránh bị lặp
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # File build có tên chứa mã băm nên lưu đệm lâu được
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Mọi đường dẫn khác trả về index.html (React Router xử lý)
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
