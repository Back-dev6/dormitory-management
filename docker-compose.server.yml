# Dùng trên MÁY CHỦ: chạy bằng image đã build sẵn trên Docker Hub (không cần mã nguồn).
# Trên máy chủ, đổi tên thành docker-compose.yml rồi: docker compose pull && docker compose up -d
name: dormitory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Không mở cổng ra ngoài: chỉ container api truy cập được

  api:
    image: ${DOCKERHUB_USERNAME:?Thiếu DOCKERHUB_USERNAME trong file .env}/dormitory-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong file .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Thiếu CORS_ORIGINS trong file .env}
      STORAGE_DIR: /app/storage
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      # Thư mục trên máy chủ, thuộc uid 10001 (user chạy API), quyền 750
      - /srv/dormitory/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ${DOCKERHUB_USERNAME}/dormitory-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
